suite: secrets
release:
  name: stackradar
  namespace: sr-test
tests:
  - it: inline fixtures render the chart-managed application Secret
    template: secrets/app.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: stackradar-secrets
      - isNotNullOrEmpty:
          path: data["internal-service-key"]
      - isNotNullOrEmpty:
          path: data["api-key-encryption-key"]
      - isNotNullOrEmpty:
          path: data["auth-secret"]
      - isNotNullOrEmpty:
          path: data["admin-password"]

  - it: an existing application Secret suppresses the chart-managed one and renames its keys
    set:
      secrets.existingSecret.name: my-secrets
      secrets.existingSecret.internalServiceKeyKey: isk
    asserts:
      - hasDocuments:
          count: 0
        template: secrets/app.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INTERNAL_SERVICE_KEY
            valueFrom:
              secretKeyRef:
                name: my-secrets
                key: isk
        template: server/deployment.yaml

  - it: an existing application Secret plus a changed inline value fails fast
    set:
      secrets.existingSecret.name: my-secrets
      secrets.authSecret: something-else
    template: server/deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "secrets.existingSecret.name is set; leave secrets.{authSecret} at their defaults to avoid ambiguity about which values are in effect"

  - it: a blanked inline secret fails with the command that generates one
    set:
      secrets.apiKeyEncryptionKey: ""
    template: server/deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: "the chart never generates secrets; set secrets.apiKeyEncryptionKey \\(openssl rand -hex 32\\)"

  - it: a malformed encryption key fails fast
    set:
      secrets.apiKeyEncryptionKey: not-hex
    template: server/deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "secrets.apiKeyEncryptionKey must be 64 hex characters (openssl rand -hex 32)"

  - it: bundled Postgres and an external database together fail fast
    set:
      database.url: "postgresql://u:p@h:5432/d?sslmode=require"
    template: server/deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: "postgresql.enabled is true \\(the bundled Postgres\\) and database.url / database.existingSecret.name point at an external one"

  - it: an external database renders the chart-managed url Secret and no bundle
    set:
      postgresql.enabled: false
      database.url: "postgresql://u:p@db.example:5432/d?sslmode=require"
    asserts:
      - hasDocuments:
          count: 1
        template: secrets/db.yaml
      - equal:
          path: data.url
          value: cG9zdGdyZXNxbDovL3U6cEBkYi5leGFtcGxlOjU0MzIvZD9zc2xtb2RlPXJlcXVpcmU=
        template: secrets/db.yaml
      - hasDocuments:
          count: 0
        template: postgresql/statefulset.yaml
      - hasDocuments:
          count: 0
        template: secrets/postgresql.yaml
      - notExists:
          path: spec.template.spec.initContainers
        template: server/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: stackradar-db
                key: url
        template: server/deployment.yaml

  - it: an external database URL without sslmode fails fast
    set:
      postgresql.enabled: false
      database.url: "postgresql://u:p@db.example:5432/d"
    template: server/deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.url must carry an explicit sslmode"

  - it: an existing database Secret is read with its own key and mounts the CA when named
    set:
      postgresql.enabled: false
      database.existingSecret.name: my-db
      database.existingSecret.urlKey: dsn
      database.existingSecret.caCertKey: ca.pem
    asserts:
      - hasDocuments:
          count: 0
        template: secrets/db.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: my-db
                key: dsn
        template: client/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_CA_CERT
            valueFrom:
              secretKeyRef:
                name: my-db
                key: ca.pem
        template: client/deployment.yaml

  - it: an existing database Secret plus database.url fails fast
    set:
      postgresql.enabled: false
      database.existingSecret.name: my-db
      database.url: "postgresql://u:p@h:5432/d?sslmode=require"
    template: server/deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "database.existingSecret.name is set; remove database.url to avoid ambiguity about which connection string is in effect"

  - it: neither bundle nor external database fails with the hint
    set:
      postgresql.enabled: false
    template: server/deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: "postgresql.enabled is false, so the chart needs an external database"

  - it: an existing Postgres password Secret suppresses the chart-managed one
    set:
      postgresql.auth.existingSecret.name: pg-creds
      postgresql.auth.existingSecret.passwordKey: pw
    asserts:
      - hasDocuments:
          count: 0
        template: secrets/postgresql.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: pg-creds
                key: pw
        template: postgresql/statefulset.yaml

  - it: nothing in the chart calls lookup or generates randomness
    template: server/deployment.yaml
    asserts:
      - notMatchRegexRaw:
          pattern: randAlpha|randNumeric|randAscii|genPrivateKey|derivePassword
