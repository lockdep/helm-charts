{{- if eq (include "stackradar.topology" .) "split" }}
{{- $envFrom := concat .Values.server.extraEnvFrom .Values.worker.extraEnvFrom -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stackradar.worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "stackradar.componentLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
  {{- with .Values.worker.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.worker.revisionHistoryLimit }}
  strategy: {{- toYaml .Values.server.deployment.strategy | nindent 4 }}
  selector:
    matchLabels: {{- include "stackradar.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stackradar.selectorLabels" (dict "ctx" . "component" "worker") | nindent 8 }}
        {{- include "stackradar.databaseClientLabel" . | nindent 8 }}
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.worker.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "stackradar.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with .Values.worker.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.server.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $waitInit := include "stackradar.waitForPostgresInitContainer" . }}
      {{- if or $waitInit .Values.server.initContainers }}
      initContainers:
        {{- $waitInit | nindent 8 }}
        {{- with .Values.server.initContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "stackradar.server.image" . }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          {{- with .Values.server.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - node
            - dist/src/worker.js
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          env:
            {{- include "stackradar.serverEnv" (dict "ctx" . "role" "worker") | nindent 12 }}
          {{- with $envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.server.additionalVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        # syft unpacks image layers here and helm keeps its cache under $HOME=/tmp.
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.worker.tmpSizeLimit | quote }}
        {{- with .Values.server.additionalVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.worker.tolerations | default .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.nodeSelector | default .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
