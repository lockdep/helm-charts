{{- if .Values.postgresql.enabled -}}
---
# Rendered whenever the bundle is on, whatever `networkPolicy.enabled` says:
# a database whose password may still be the public fixture must not be
# reachable from every pod in the cluster. Admits exactly the pods of this
# release that open a connection — they carry the `stackradar.io/database-client`
# label — and nothing else. Inert on a CNI that does not enforce
# NetworkPolicy, which is one more reason to set your own password.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stackradar.postgresql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "stackradar.componentLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "stackradar.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              stackradar.io/database-client: "true"
      ports:
        - protocol: TCP
          port: postgresql
{{- end }}
