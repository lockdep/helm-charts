{{- if .Values.postgresql.enabled -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stackradar.postgresql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "stackradar.componentLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
  selector: {{- include "stackradar.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
{{- end }}
