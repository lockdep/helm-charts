---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stackradar.server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "stackradar.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
  {{- with .Values.server.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
      {{- if not (kindIs "invalid" .Values.server.service.nodePort) }}
      nodePort: {{ .Values.server.service.nodePort }}
      {{- end }}
  selector: {{- include "stackradar.selectorLabels" (dict "ctx" . "component" "server") | nindent 4 }}
