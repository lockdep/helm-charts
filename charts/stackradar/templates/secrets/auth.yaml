{{- include "stackradar.validate.auth" . }}
{{- if eq (include "stackradar.auth.chartManaged" .) "true" -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stackradar.auth.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "stackradar.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{- range $name := list "oidc" "github" "google" }}
  {{- $p := index $.Values.auth $name }}
  {{- if and (not $p.existingSecret.name) $p.clientId $p.clientSecret }}
  {{ $name }}-client-id: {{ $p.clientId | b64enc | quote }}
  {{ $name }}-client-secret: {{ $p.clientSecret | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
