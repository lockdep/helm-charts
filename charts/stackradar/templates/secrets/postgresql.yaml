{{- include "stackradar.validate.database" . }}
{{- if eq (include "stackradar.postgresql.chartManaged" .) "true" -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stackradar.postgresql.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "stackradar.componentLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.postgresql.auth.password | b64enc | quote }}
{{- end }}
