{{- include "stackradar.validate.database" . }}
{{- if eq (include "stackradar.db.chartManaged" .) "true" -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stackradar.db.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "stackradar.commonLabels" . | nindent 4 }}
type: Opaque
data:
  url: {{ .Values.database.url | b64enc | quote }}
{{- end }}
