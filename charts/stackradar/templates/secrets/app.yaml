{{- include "stackradar.validate.secrets" . }}
{{- if eq (include "stackradar.secrets.chartManaged" .) "true" -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stackradar.secrets.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "stackradar.commonLabels" . | nindent 4 }}
type: Opaque
data:
  internal-service-key: {{ .Values.secrets.internalServiceKey | b64enc | quote }}
  api-key-encryption-key: {{ .Values.secrets.apiKeyEncryptionKey | b64enc | quote }}
  auth-secret: {{ .Values.secrets.authSecret | b64enc | quote }}
  {{- if .Values.auth.local.enabled }}
  admin-password: {{ .Values.auth.local.adminPassword | b64enc | quote }}
  {{- end }}
{{- end }}
